plugins {
    id 'com.android.application'
}

android {
    namespace 'club.practicaintegral.equilibra'
    compileSdk 36

    defaultConfig {
        applicationId 'club.practicaintegral.equilibra'
        minSdk 26
        targetSdk 36 // Google Play pide Android 16 (API 36) desde el 31-08-2026 (2.46)
        // La compilación automática de GitHub pone el número de versión
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'sin-clave.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'pasos'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildFeatures { buildConfig true }

    // 2.46: dos versiones de la misma app. «web» = la APK que se descarga de la web (se actualiza ella sola);
    // «play» = el .aab para Google Play (sin el permiso de instalar paquetes: en Play se actualiza la tienda).
    flavorDimensions 'tienda'
    productFlavors {
        web { dimension 'tienda'; buildConfigField 'boolean', 'DE_PLAY', 'false' }
        play { dimension 'tienda'; buildConfigField 'boolean', 'DE_PLAY', 'true' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Entrar con Google dentro de la app (Credential Manager de Android + identidad de Google)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
